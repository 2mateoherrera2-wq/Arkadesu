<script>
const C=document.getElementById('c'),B=document.createElement('canvas'),W=960,H=540;B.width=W;B.height=H;const X=B.getContext('2d');
// ===== PERSONAJES: añade los tuyos aquí =====
// Opcional: draw(X,x,y,dir,ataque) para dibujar tu propio sprite
const CHARS=[
{n:'Vrute',col:'#4ade80',spd:4.2,jmp:11.5,wt:1,pow:1,pe:1,pcol:'#a3e635'},
{n:'Brute',col:'#f87171',spd:3,jmp:10.5,wt:1.4,pow:1.35,pe:2,pcol:'#fb923c'},
{n:'Rude',col:'#facc15',spd:5.5,jmp:12,wt:.8,pow:.8,pe:3,pcol:'#facc15'},
{n:'Shrude',col:'#a78bfa',spd:4.6,jmp:11,wt:1,pow:1,pe:4,pcol:'#e879f9'}];
// ===== PROYECTILES (efectos de poder). pe = indice en EFX, pcol = color del proyectil (null = color base) =====
// dm daño, kb empuje, sp velocidad, l vida, r radio de impacto, cd recarga, st estado (1 veneno, 2 fuego, 3 descarga, 4 hielo), stt duracion, fz aturdimiento extra
const EFX=[
{n:'BOLA',d:'DISPARO NORMAL',ch:['@','O'],tr:['.'],dm:4,kb:1,sp:8,l:70,r:22,cd:45},
{n:'VENENO',d:'ENVENENA (DANO LENTO)',ch:['o','%'],tr:['o','.'],dm:3,kb:.6,sp:7,l:80,r:22,cd:50,st:1,stt:150},
{n:'FUEGO',d:'GRANDE, EMPUJA Y QUEMA',ch:['@','*','&'],tr:['*','^','.'],dm:5,kb:1.5,sp:6.5,l:80,r:28,cd:70,st:2,stt:120},
{n:'RAYO',d:'RAPIDO Y PARALIZA',ch:['/','\\','Z'],tr:['/','-','.'],dm:3,kb:.5,sp:14,l:45,r:22,cd:30,st:3,fz:16},
{n:'TELEDIR.',d:'PERSIGUE AL RIVAL',ch:['O','o'],tr:[':','.'],dm:3,kb:.8,sp:6,l:120,r:22,cd:60},
{n:'HIELO',d:'CONGELA AL RIVAL',ch:['*','+'],tr:['*','.'],dm:2,kb:.2,sp:8,l:70,r:22,cd:60,st:4,fz:38},
{n:'BUMERAN',d:'IDA Y VUELTA, GOLPEA 2X',ch:['-','\\','|','/'],tr:['-','.'],dm:3,kb:.7,sp:9,l:100,r:24,cd:55},
{n:'BOMBA',d:'EXPLOTA EN AREA',ch:['O','o'],tr:['.',','],dm:7,kb:1,sp:6.5,l:90,r:24,cd:80},
{n:'ABANICO',d:'ABANICO DE 3 BOLAS',ch:['o','*'],tr:['.'],dm:2,kb:.7,sp:8,l:60,r:22,cd:65}];
const pcl=c=>c.pcol||c.col;

// ===== SONIDO (sintetizado con WebAudio, sin archivos). Tecla M = silenciar / activar =====
let AC=null,MG=null,MUTE=0,PS='',BEEP=-1,PRL=0,VOL=10,PAU=0,PI=0,PH=0;
try{MUTE=localStorage.getItem('smashar_mute')=='1'?1:0}catch(e){}
try{const v=localStorage.getItem('smashar_vol');if(v!=null)VOL=Math.max(0,Math.min(10,Math.round(+v||0)))}catch(e){}
function au(){if(AC===null){try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.35*VOL/10;MG.connect(AC.destination)}catch(e){AC=0}}
 if(AC&&AC.state=='suspended')AC.resume();return AC}
function setVol(v){VOL=Math.max(0,Math.min(10,v));try{localStorage.setItem('smashar_vol',VOL)}catch(e){}if(MG)MG.gain.value=.35*VOL/10}
function muteT(){MUTE=MUTE?0:1;try{localStorage.setItem('smashar_mute',MUTE)}catch(e){}toast='SONIDO '+(MUTE?'APAGADO':'ENCENDIDO');tt=90;if(!MUTE)sfx('ok')}
function tone(f,d,ty,v,f2,dl){const a=au();if(!a||MUTE)return;const t=a.currentTime+(dl||0),o=a.createOscillator(),g=a.createGain();
 o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.2,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.03)}
function noise(d,v,f0,f1,dl){const a=au();if(!a||MUTE)return;const t=a.currentTime+(dl||0),n=Math.max(1,a.sampleRate*d|0),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);
 for(let i=0;i<n;i++)x[i]=Math.random()*2-1;
 const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=b;fl.type='bandpass';fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(Math.max(50,f1||f0),t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(MG);s.start(t)}
const SFX={
 move:()=>tone(520,.05,'square',.12),
 hover:()=>tone(760,.04,'triangle',.14),
 ok:()=>{tone(660,.07,'square',.16);tone(990,.1,'square',.16,0,.06)},
 back:()=>tone(420,.1,'square',.14,240),
 edit:()=>tone(600,.04,'square',.09),
 err:()=>tone(160,.16,'square',.18,100),
 ready:()=>{[523,659,784].forEach((f,i)=>tone(f,.1,'square',.16,0,i*.06))},
 jump:()=>tone(260,.15,'square',.12,620),
 land:()=>noise(.06,.18,700,250),
 swing:()=>noise(.13,.28,3000,500),
 shoot:e=>[
  ()=>{tone(1000,.16,'sawtooth',.12,180);noise(.08,.1,3000,1000)},
  ()=>{tone(300,.22,'sine',.2,520);tone(420,.2,'sine',.12,250,.05)},
  ()=>{noise(.3,.3,1800,250);tone(220,.25,'sawtooth',.14,90)},
  ()=>{tone(1800,.08,'square',.12,400);tone(2200,.08,'square',.1,500,.05);noise(.1,.15,5000,1500)},
  ()=>{tone(400,.3,'triangle',.18,1000);tone(600,.3,'sine',.1,1400,.05)},
  ()=>{tone(1500,.18,'sine',.16,900);tone(2000,.14,'triangle',.1,1200,.04)},
  ()=>{tone(300,.25,'sawtooth',.12,800);tone(800,.2,'sawtooth',.08,300,.2)},
  ()=>{tone(160,.22,'square',.2,90);noise(.1,.12,800,300)},
  ()=>{noise(.14,.2,3500,800);tone(900,.12,'sawtooth',.1,300);tone(700,.12,'sawtooth',.08,260,.05)}][e||0](),
 boom:()=>{noise(.45,.55,1400,90);tone(130,.4,'sawtooth',.3,38)},
 hit:a=>{a=a||6;const s=Math.min(1,.5+a/14);noise(.16,.5*s,2200,180);tone(Math.max(60,160-a*3),.18,'sawtooth',.32*s,45)},
 ko:()=>{noise(.7,.5,1500,70);tone(220,.7,'sawtooth',.3,35);tone(110,.5,'square',.2,30,.05)},
 beep:()=>tone(440,.14,'square',.2),
 go:()=>{tone(880,.3,'square',.22);tone(1320,.3,'square',.12,0,.03)},
 win:()=>{[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.16,'square',.17,0,i*.11))}};
function sfx(n,a){try{SFX[n]&&SFX[n](a)}catch(e){}}

// ===== EDITOR DE PERSONAJES (se guarda en el navegador con localStorage) =====
// Solo se edita nombre, color, cabeza y puntos de stats. La cabeza se aplica a TODAS las poses.
const NB=CHARS.length,MAXC=10,BUD=20,
PAL16=['#4ade80','#f87171','#facc15','#a78bfa','#60a5fa','#fb923c','#f472b6','#2dd4bf','#e5e7eb','#a3e635','#38bdf8','#e879f9','#fbbf24','#f43f5e','#94a3b8','#ffffff'],
HEADS=['O','o','0','@','Q','*','#','X','&','$','%','8','6','G','D','U','V','W'],
EF=[{k:'spd',a:2,s:.5,d:1,l:'VELOCIDAD',b:7},{k:'jmp',a:9,s:.5,d:1,l:'SALTO',b:14},{k:'wt',a:.6,s:.12,d:2,l:'PESO',b:1.8},{k:'pow',a:.6,s:.1,d:2,l:'PODER',b:1.6}],
PN=['QUIETO','SALTO','CORRER','GOLPEADO'],
ED={m:0,i:0,f:0,ci:0,del:0,msg:'',mt:0,w:0};
let TEST=0;
function applyPt(c){EF.forEach((f,j)=>c[f.k]=+(f.a+c.pt[j]*f.s).toFixed(2))}
function san(o){if(!o||typeof o!='object')return null;
 let h=typeof o.h=='string'&&o.h.trim()?[...o.h.trim()][0]:(Array.isArray(o.pz)&&o.pz[0]&&typeof o.pz[0][0]=='string'&&o.pz[0][0][1]&&o.pz[0][0][1]!=' '?o.pz[0][0][1]:'O');
 if(h.length!=1||h.charCodeAt(0)<32)h='O';
 const pt=Array.isArray(o.pt)&&o.pt.length==4?o.pt.map(v=>Math.max(0,Math.min(10,Math.round(+v)||0))):EF.map(f=>{const v=+o[f.k];return isFinite(v)&&o[f.k]!=null?Math.max(0,Math.min(10,Math.round((v-f.a)/f.s))):5});
 for(let t=pt.reduce((a,b)=>a+b,0),j=0;t>BUD;j=(j+1)%4)if(pt[j]>0){pt[j]--;t--}
 const lc=Array.isArray(o.lc)&&o.lc.length==5?o.lc.map(v=>/^#[0-9a-f]{6}$/i.test(v)?v:null):[null,null,null,null,null];
 const c={n:String(o.n||'SIN NOMBRE').toUpperCase().slice(0,10),col:/^#[0-9a-f]{6}$/i.test(o.col)?o.col:PAL16[0],h,pt,lc,pe:Math.max(0,Math.min(EFX.length-1,Math.round(+o.pe)||0)),pcol:/^#[0-9a-f]{6}$/i.test(o.pcol)?o.pcol:null};applyPt(c);return c}
function newChar(){return san({n:'NUEVO',col:PAL16[Math.random()*16|0]})}
function dup(c){return san(Object.assign({},c,{n:(c.n+' 2').slice(0,10)}))}
function saveCh(){try{localStorage.setItem('smashar_chars',JSON.stringify(CHARS.slice(NB)));return 1}catch(e){return 0}}
function loadCh(){CHARS.length=NB;try{JSON.parse(localStorage.getItem('smashar_chars')||'[]').slice(0,MAXC-NB).forEach(o=>{const c=san(o);c&&CHARS.push(c)})}catch(e){}}
loadCh();
function svc(){if(!saveCh()&&!ED.w){ED.w=1;edMsg('NO SE PUEDE GUARDAR EN ESTE NAVEGADOR')}}
function edMsg(s){ED.msg=s;ED.mt=150}
function edOpen(){ED.m=0;ED.i=0;ED.del=0;scene='ed'}
function edKey(e){const k=e.key;if((e.ctrlKey||e.metaKey||e.altKey)&&!e.getModifierState('AltGraph'))return;
 if(!/^F(5|11|12)$/.test(k))e.preventDefault();
 if(e.repeat&&!/^Arrow|^Backspace$/.test(k))return;
 if(k=='F8'){muteT();return}
 const s0=ED.f+ED.i*100+ED.m*10000;ED.m?edEdit(k,e):edList(k);
 if(ED.mt!=150&&(k.length==1||/^(Arrow|Backspace|Delete|Enter|Escape)/.test(k)))sfx(k=='Escape'?'back':k=='Enter'?'ok':ED.f+ED.i*100+ED.m*10000!=s0?'move':'edit')}
function edList(k){const N=CHARS.length+1,d=ED.del;ED.del=0;
 if(k=='ArrowUp')ED.i=(ED.i+N-1)%N;
 else if(k=='ArrowDown')ED.i=(ED.i+1)%N;
 else if(k=='Escape'){saveCh();scene='menu';mi=3}
 else if(k=='Enter'){const j=ED.i-1;
  if(j>=NB)ED.ci=j;
  else{if(CHARS.length>=MAXC)return edMsg('YA HAY '+MAXC+' PERSONAJES: BORRA ALGUNO');CHARS.push(j<0?newChar():dup(CHARS[j]));ED.ci=CHARS.length-1;svc()}
  Object.assign(ED,{m:1,f:0})}
 else if(k=='Delete'||k=='Backspace'){const j=ED.i-1;
  if(j<NB)return edMsg(j<0?'ELIGE UN PERSONAJE PROPIO':'LOS PERSONAJES BASE NO SE BORRAN');
  if(!d){ED.del=1;return edMsg('PULSA BORRAR OTRA VEZ PARA CONFIRMAR')}
  CHARS.splice(j,1);ED.i=Math.min(ED.i,CHARS.length);svc();edMsg('PERSONAJE BORRADO')}
 else if(k=='c'||k=='C')edCopy();
 else if(k=='i'||k=='I')edImp()}
function edCopy(){if(ED.i<=NB)return edMsg('ELIGE UN PERSONAJE PROPIO PARA COPIAR SU CODIGO');
 const t=JSON.stringify(CHARS[ED.i-1]),ok=()=>edMsg('CODIGO COPIADO AL PORTAPAPELES'),no=()=>{prompt('Copia este código (Ctrl+C):',t)};
 try{navigator.clipboard.writeText(t).then(ok,no)}catch(e){no()}}
function edImp(){const t=prompt('Pega el código del personaje:');if(!t)return;
 try{let a=JSON.parse(t),n=0;a=Array.isArray(a)?a:[a];a.forEach(o=>{const c=san(o);if(c&&CHARS.length<MAXC){CHARS.push(c);n++}});svc();edMsg(n?'IMPORTADOS: '+n:'NO SE IMPORTO NADA (LLENO O INVALIDO)')}
 catch(e){edMsg('CODIGO INVALIDO')}}
// Campos: 0 nombre, 1 color base, 2 cabeza (simbolo), 3-7 colores (cabeza, brazo atras, brazo frente, pierna atras, pierna frente), 8-11 stats (puntos)
const FN=14;
function edEdit(k,e){const c=CHARS[ED.ci],F=ED.f;
 if(k=='Escape'){svc();ED.m=0;ED.i=ED.ci+1;return}
 if(k=='F4'){svc();mode='local';sel=[ED.ci,0];ready=[0,0];TEST=1;initMatch();scene='fight';return}
 if(k=='Enter'||k=='ArrowDown'){ED.f=(F+1)%FN;return}
 if(k=='ArrowUp'){ED.f=(F+FN-1)%FN;return}
 if(F>2&&F<8&&k=='Backspace'){c.lc[F-3]=null;return svc()}
 if(F==13&&k=='Backspace'){c.pcol=null;return svc()}
 if(k=='ArrowLeft'||k=='ArrowRight'){const d=k=='ArrowLeft'?-1:1;
  if(F==1)c.col=PAL16[(PAL16.indexOf(c.col)+d+16)%16];
  else if(F==2)c.h=HEADS[(HEADS.indexOf(c.h)+d+HEADS.length)%HEADS.length];
  else if(F<8){const j=F-3,i=c.lc[j]?1+PAL16.indexOf(c.lc[j]):0,n=(Math.max(0,i)+d+17)%17;c.lc[j]=n?PAL16[n-1]:null}
  else if(F==12)c.pe=((c.pe||0)+d+EFX.length)%EFX.length;
  else if(F==13){const i=c.pcol?1+PAL16.indexOf(c.pcol):0,n=(Math.max(0,i)+d+17)%17;c.pcol=n?PAL16[n-1]:null}
  else{const j=F-8,u=c.pt.reduce((a,b)=>a+b,0),n=c.pt[j]+d;
   if(d>0&&u>=BUD){sfx('err');return edMsg('NO QUEDAN PUNTOS: BAJA OTRA STAT')}
   if(n<0||n>10)return;c.pt[j]=n;applyPt(c)}
  return svc()}
 if(F==0){if(k=='Backspace')c.n=c.n.slice(0,-1);else if(k.length==1&&c.n.length<10)c.n+=k.toUpperCase();return svc()}
 if(F==2&&k.length==1&&k!=' '){c.h=k;svc()}}
function edBar(l,v,a,b,d,c,r,col){const k=Math.max(0,Math.min(10,Math.round((v-a)/(b-a)*10)));tx(l.padEnd(10)+'['+'#'.repeat(k)+'.'.repeat(10-k)+'] '+v.toFixed(d),c,r,col)}
function edDraw(){fl(0,0,CO,1,'#ef4444');tx('EDITOR DE PERSONAJES',60,0,'#000','#ef4444',1);
 ED.m?edView():edRoster();
 if(ED.mt>0){ED.mt--;tx(ED.msg,60,32,'#fde047',0,1)}}
function edRoster(){
 tx('ARRIBA/ABAJO: ELEGIR     ENTER: EDITAR (LOS BASE SE COPIAN)     BORRAR: ELIMINAR',60,2,'#fde047',0,1);
 tx('C: COPIAR CODIGO     I: IMPORTAR CODIGO     ESC: VOLVER     MAXIMO '+MAXC+' PERSONAJES',60,3,'#94a3b8',0,1);
 const N=CHARS.length+1,s=ED.i?CHARS[ED.i-1]:0;
 bx(4,5,46,N+2,'#64748b',1);
 for(let i=0;i<N;i++){const on=i==ED.i,c=i?CHARS[i-1]:0,t=(on?'> ':'  ')+(i?c.n+(i<=NB?'  [BASE]':''):'+ NUEVO PERSONAJE');
  tx(on?t.padEnd(44):t,6,6+i,on?'#000':(c?c.col:'#4ade80'),on?'#fde047':0)}
 bx(54,5,62,22,'#64748b',1);
 if(!s){tx('CREA UN LUCHADOR NUEVO',85,10,'#fff',0,1);tx('NOMBRE, COLOR, CABEZA Y PUNTOS DE STATS',85,12,'#94a3b8',0,1);tx('ENTER PARA EMPEZAR',85,15,'#fde047',0,1);return}
 tx(s.n,85,6,s.col,0,1);
 PN.forEach((n,p)=>{const x=66+p*12;spr(x*8,12*16,s,1,0,0,'',null,p);tx(n,x,13,'#64748b',0,1);spr(x*8,18*16,s,-1,0,0,'',null,p)});
 tx('(ARRIBA: MIRANDO A LA DERECHA - ABAJO: A LA IZQUIERDA)',85,19,'#475569',0,1);
 EF.forEach((f,j)=>edBar(f.l,s[f.k],f.a,f.b,f.d,60,21+j,'#94a3b8'));tx('PROYECTIL  '+EFX[s.pe||0].n,60,25,pcl(s))}
const LN=['NOMBRE','COLOR BASE','CABEZA','COL CABEZA','BRAZO ATRAS','BRAZO FRENTE','PIERNA ATRAS','PIERNA FRENTE','VELOCIDAD','SALTO','PESO','PODER','PROYECTIL','COLOR PROY.'];
function edView(){const c=CHARS[ED.ci],F=ED.f,row=i=>6+i,lab=i=>tx((F==i?'> ':'  ')+LN[i],5,row(i),F==i?'#fde047':'#e2e8f0'),u=c.pt.reduce((a,b)=>a+b,0);
 tx('ARRIBA/ABAJO: CAMPO     IZQ/DER: CAMBIAR O REPARTIR PUNTOS     TEXTO: NOMBRE Y CABEZA',60,2,'#fde047',0,1);
 tx('F4: PROBAR EN ARENA     ENTER: SIGUIENTE     BORRAR: COLOR AUTO     ESC: GUARDAR Y SALIR',60,3,'#94a3b8',0,1);
 bx(3,5,54,27,'#64748b',1);bx(58,5,58,27,'#64748b',1);
 lab(0);tx('['+(c.n+(F==0&&fr>>4&1?'_':'')).padEnd(11)+']',20,row(0),'#fff');
 lab(1);tx('<',20,row(1),'#fde047');tx('#######',22,row(1),c.col);tx('>',30,row(1),'#fde047');tx(c.col,33,row(1),'#94a3b8');
 lab(2);tx('<',20,row(2),'#fde047');tx(c.h,22,row(2),c.col);tx('>',24,row(2),'#fde047');tx('O TECLA PARA ESCRIBIRLA',28,row(2),'#94a3b8');
 for(let j=0;j<5;j++){const i=j+3,r=row(i),v=c.lc[j];lab(i);tx('<',20,r,'#fde047');tx('#######',22,r,v||c.col);tx('>',30,r,'#fde047');tx(v||'AUTO (COLOR BASE)',33,r,'#94a3b8')}
 EF.forEach((f,j)=>{const i=j+8,r=row(i),n=c.pt[j];lab(i);tx('< '+String(n).padStart(2)+' >',20,r,'#fff');tx('['+'#'.repeat(n)+'.'.repeat(10-n)+']',29,r,c.col);tx(c[f.k].toFixed(f.d),42,r,'#94a3b8')});
 {const r=row(12),e=EFX[c.pe||0];lab(12);tx('<',20,r,'#fde047');tx(e.n.padEnd(8),22,r,pcl(c));tx('>',31,r,'#fde047');tx(e.d,33,r,'#94a3b8')}
 {const r=row(13);lab(13);tx('<',20,r,'#fde047');tx('#######',22,r,pcl(c));tx('>',30,r,'#fde047');tx(c.pcol||'AUTO (COLOR BASE)',33,r,'#94a3b8')}
 tx('PUNTOS LIBRES: '+(BUD-u)+' / '+BUD,5,21,u>=BUD?'#fde047':'#e2e8f0');tx('['+'#'.repeat(BUD-u)+'.'.repeat(u)+']',29,21,'#fde047');
 {const k=c.pe||0,cc=pcl(c),t=(fr>>1)%14,x=k==6?42+Math.round(Math.abs(Math.sin(fr*.045))*12):42+t;
  tx('PROYECTIL',48,23,'#94a3b8',0,1);
  if(k==8)[-1,0,1].forEach(v=>prDraw(k,cc,x,26+Math.round(v*t/6)));else prDraw(k,cc,x,k==7?26-Math.round(Math.sin(t/13*Math.PI)*2):26);
  tx(EFX[k].n,48,29,cc,0,1)}
 tx('CABEZA Y COLORES VALEN PARA TODAS LAS POSES',5,22,'#64748b');
 tx('ASI SE VE',30,23,'#94a3b8',0,1);spr(24*8,27*16,c,1,0,0,'',null,0);spr(36*8,27*16,c,-1,0,0,'',null,0);
